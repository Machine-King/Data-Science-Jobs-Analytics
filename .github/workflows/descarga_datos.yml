name: Descarga de datos Jooble

on:
  schedule:
    # Semanal: lunes a las 06:00 UTC (08:00 España en verano, 07:00 en invierno)
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: descarga-datos
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Instalar dependencias
        run: pip install -r requirements-api.txt

      - name: Descargar datos y cargar en PostgreSQL
        env:
          JOOBLE_API_KEYS: ${{ secrets.JOOBLE_API_KEYS }}
          POSTGRES_CONN_STR: ${{ secrets.POSTGRES_CONN_STR }}
        run: python api_template.py
